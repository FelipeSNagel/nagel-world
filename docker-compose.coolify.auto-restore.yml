services:
  restore-from-drive:
    image: rclone/rclone:latest
    restart: "no"
    entrypoint: ["/bin/sh", "-lc"]
    environment:
      RCLONE_CONFIG_B64: "${RCLONE_CONFIG_B64:?Configure RCLONE_CONFIG_B64 in Coolify}"
      CRAFT_CLOUD_REMOTE: "${CRAFT_CLOUD_REMOTE:-gdrive}"
      CRAFT_CLOUD_PATH: "${CRAFT_CLOUD_PATH:-minecraft-nagel/craftlandia-backups}"
      CRAFT_LEVEL_NAME: "${CRAFT_LEVEL_NAME:-CraftlandiaWorld}"
      RESTORE_MODE: "${RESTORE_MODE:-once}"
    command: |
      set -eu

      RCLONE_CONFIG_DIR="/config/rclone"
      RCLONE_CONFIG_FILE="$$RCLONE_CONFIG_DIR/rclone.conf"
      DATA_ROOT="/data-root"
      DATA_DIR="$$DATA_ROOT/craftlandia-data"
      BACKUP_DIR="$$DATA_ROOT/craftlandia-backups"
      MARKER="$$DATA_ROOT/.nagel-restored-from-drive"
      REMOTE="$${CRAFT_CLOUD_REMOTE}:$${CRAFT_CLOUD_PATH}"

      mkdir -p "$$RCLONE_CONFIG_DIR" "$$BACKUP_DIR"
      printf '%s' "$$RCLONE_CONFIG_B64" | base64 -d > "$$RCLONE_CONFIG_FILE"

      if [ -d "$$DATA_DIR" ]; then
        mkdir -p "$$DATA_DIR/plugins/Essentials/warps"
        rm -f "$$DATA_DIR/commands.yml"
        printf 'world: %s\nx: 0.5\ny: 90.0\nz: 0.5\nyaw: 180.0\npitch: 0.0\nname: mercado\n' "$$CRAFT_LEVEL_NAME" > "$$DATA_DIR/plugins/Essentials/warps/mercado.yml"
        essentials_config="$$DATA_DIR/plugins/Essentials/config.yml"
        if [ -f "$$essentials_config" ]; then
          sed -i \
            -e 's/^respawn-listener-priority:.*/respawn-listener-priority: high/' \
            -e 's/^respawn-at-home:.*/respawn-at-home: true/' \
            -e 's/^respawn-at-home-bed:.*/respawn-at-home-bed: true/' \
            -e 's/^respawn-at-anchor:.*/respawn-at-anchor: true/' \
            "$$essentials_config"
        fi
      fi

      if [ "$$RESTORE_MODE" != "force" ] && [ -f "$$MARKER" ]; then
        echo "Backup already restored. Set RESTORE_MODE=force to restore again."
        exit 0
      fi

      latest="$$(rclone --config "$$RCLONE_CONFIG_FILE" lsf "$$REMOTE" --files-only | grep '^craftlandia-[0-9]\{8\}-[0-9]\{6\}\.tar\.gz$$' | sort | tail -n 1)"

      if [ -z "$$latest" ]; then
        echo "No backup found in $$REMOTE"
        exit 1
      fi

      echo "Downloading $$REMOTE/$$latest"
      rclone --config "$$RCLONE_CONFIG_FILE" copyto "$$REMOTE/$$latest" "$$BACKUP_DIR/$$latest"

      if [ -d "$$DATA_DIR" ]; then
        safety_dir="$$DATA_DIR.before-restore-$$(date +%Y%m%d-%H%M%S)"
        echo "Moving current data to $$safety_dir"
        mv "$$DATA_DIR" "$$safety_dir"
      fi

      echo "Restoring $$latest"
      tar -C "$$DATA_ROOT" -xzf "$$BACKUP_DIR/$$latest"
      mkdir -p "$$DATA_DIR/plugins/Essentials/warps"
      rm -f "$$DATA_DIR/commands.yml"
      printf 'world: %s\nx: 0.5\ny: 90.0\nz: 0.5\nyaw: 180.0\npitch: 0.0\nname: mercado\n' "$$CRAFT_LEVEL_NAME" > "$$DATA_DIR/plugins/Essentials/warps/mercado.yml"
      essentials_config="$$DATA_DIR/plugins/Essentials/config.yml"
      if [ -f "$$essentials_config" ]; then
        sed -i \
          -e 's/^respawn-listener-priority:.*/respawn-listener-priority: high/' \
          -e 's/^respawn-at-home:.*/respawn-at-home: true/' \
          -e 's/^respawn-at-home-bed:.*/respawn-at-home-bed: true/' \
          -e 's/^respawn-at-anchor:.*/respawn-at-anchor: true/' \
          "$$essentials_config"
      fi
      chown -R 1000:1000 "$$DATA_DIR" 2>/dev/null || true
      date -u +"%Y-%m-%dT%H:%M:%SZ $$latest" > "$$MARKER"

      echo "Restore complete."
    volumes:
      - /data/minecraft-nagel:/data-root

  craftlandia:
    image: itzg/minecraft-server:java25
    restart: unless-stopped
    stdin_open: true
    tty: true
    depends_on:
      restore-from-drive:
        condition: service_completed_successfully
    ports:
      - "19132:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "LATEST"
      VERSION_FROM_MODRINTH_PROJECTS: "true"
      MEMORY: "${CRAFT_MEMORY:-2G}"
      SERVER_NAME: "${CRAFT_SERVER_NAME:-Nagel Craftlandia}"
      MOTD: "${CRAFT_MOTD:-Nagel Craftlandia}"
      LEVEL: "${CRAFT_LEVEL_NAME:-CraftlandiaWorld}"
      MODE: "${CRAFT_GAMEMODE:-survival}"
      DIFFICULTY: "${CRAFT_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${CRAFT_MAX_PLAYERS:-20}"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "${CRAFT_VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${CRAFT_SIMULATION_DISTANCE:-6}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${CRAFT_RCON_PASSWORD:-troque-essa-senha}"
      MARKET_WORLD: "${CRAFT_LEVEL_NAME:-CraftlandiaWorld}"
      RCON_CMDS_STARTUP: |-
        lp group default permission set essentials.help true
        lp group default permission set essentials.spawn true
        lp group default permission set essentials.sethome true
        lp group default permission set essentials.home true
        lp group default permission set essentials.delhome true
        lp group default permission set essentials.tpa true
        lp group default permission set essentials.tpahere true
        lp group default permission set essentials.tpaccept true
        lp group default permission set essentials.tpdeny true
        lp group default permission set essentials.balance true
        lp group default permission set essentials.pay true
        lp group default permission set essentials.balancetop true
        lp group default permission set essentials.sell true
        lp group default permission set essentials.sell.hand true
        lp group default permission set essentials.sell.all true
        lp group default permission set essentials.sell.inventory true
        lp group default permission set essentials.worth true
        lp group default permission set essentials.msg true
        lp group default permission set essentials.warp true
        lp group default permission set essentials.warps.* true
        lp group default permission set essentials.warps.mercado true
        lp group default permission set griefprevention.createclaims true
        lp group default permission set griefprevention.claims true
        lp group default permission set quickshop.player true
        lp group default permission set quickshop.use true
        lp group default permission set quickshop.create.cmd true
        lp group default permission set quickshop.create.sell true
        lp group default permission set quickshop.create.buy true
        lp group default permission set quickshop.create.stacks true
        lp group default permission set quickshop.create.changeitem true
        lp group default permission set quickshop.create.changeprice true
        lp group default permission set quickshop.create.changeamount true
        lp group default permission set quickshop.create.double true
        lp group default permission set quickshop.find true
        lp group default permission set quickshop.search true
        fill -12 90 -12 12 98 12 air
        fill -12 89 -12 12 89 12 stone_bricks
        fill -12 90 -12 12 90 -12 oak_fence
        fill -12 90 12 12 90 12 oak_fence
        fill -12 90 -12 -12 90 12 oak_fence
        fill 12 90 -12 12 90 12 oak_fence
        setblock 0 90 -12 air
        fill -10 90 -8 -5 90 -4 spruce_planks
        fill -10 91 -8 -10 93 -8 oak_fence
        fill -5 91 -8 -5 93 -8 oak_fence
        fill -10 91 -4 -10 93 -4 oak_fence
        fill -5 91 -4 -5 93 -4 oak_fence
        fill -10 94 -8 -5 94 -4 red_wool
        setblock -8 90 -5 barrel[facing=south]
        fill 5 90 -8 10 90 -4 spruce_planks
        fill 5 91 -8 5 93 -8 oak_fence
        fill 10 91 -8 10 93 -8 oak_fence
        fill 5 91 -4 5 93 -4 oak_fence
        fill 10 91 -4 10 93 -4 oak_fence
        fill 5 94 -8 10 94 -4 blue_wool
        setblock 8 90 -5 barrel[facing=south]
        fill -3 90 5 3 90 10 spruce_planks
        fill -3 91 5 -3 93 5 oak_fence
        fill 3 91 5 3 93 5 oak_fence
        fill -3 91 10 -3 93 10 oak_fence
        fill 3 91 10 3 93 10 oak_fence
        fill -3 94 5 3 94 10 green_wool
        setblock 0 90 7 barrel[facing=north]
        setblock 0 90 0 emerald_block
        setblock -11 90 -11 torch
        setblock 11 90 -11 torch
        setblock -11 90 11 torch
        setblock 11 90 11 torch
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_PROJECTS: |
        luckperms
        essentialsx
        essentialsx-spawn
        griefprevention
        vaultunlocked
        viaversion
        viabackwards
        quickshop-hikari?
      PLUGINS: |
        https://raw.githubusercontent.com/FelipeSNagel/nagel-world/main/config/craftlandia/NagelAliases.jar
        https://raw.githubusercontent.com/FelipeSNagel/nagel-world/main/config/craftlandia/NagelGestures.jar
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    volumes:
      - /data/minecraft-nagel/craftlandia-data:/data
