services:
  bedrock:
    image: itzg/minecraft-bedrock-server:latest
    container_name: nagel-bedrock
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${BEDROCK_PORT:-19132}:19132/udp"
    environment:
      EULA: "TRUE"
      VERSION: "${VERSION:-LATEST}"
      SERVER_NAME: "${SERVER_NAME:-Nagel Bedrock}"
      SERVER_PORT: "19132"
      GAMEMODE: "${GAMEMODE:-survival}"
      DIFFICULTY: "${DIFFICULTY:-normal}"
      LEVEL_NAME: "${LEVEL_NAME:-NagelWorld}"
      LEVEL_SEED: "${LEVEL_SEED:-}"
      LEVEL_TYPE: "${LEVEL_TYPE:-DEFAULT}"
      MAX_PLAYERS: "${MAX_PLAYERS:-10}"
      ONLINE_MODE: "${ONLINE_MODE:-true}"
      ALLOW_LIST: "${ALLOW_LIST:-false}"
      ALLOW_LIST_USERS: "${ALLOW_LIST_USERS:-}"
      ALLOW_CHEATS: "${ALLOW_CHEATS:-false}"
      DEFAULT_PLAYER_PERMISSION_LEVEL: "${DEFAULT_PLAYER_PERMISSION_LEVEL:-member}"
      VIEW_DISTANCE: "${VIEW_DISTANCE:-32}"
      TICK_DISTANCE: "${TICK_DISTANCE:-4}"
      PLAYER_IDLE_TIMEOUT: "${PLAYER_IDLE_TIMEOUT:-30}"
    volumes:
      - ./data:/data

  craftlandia:
    profiles:
      - craftlandia
    image: itzg/minecraft-server:java25
    container_name: nagel-craftlandia
    restart: unless-stopped
    stdin_open: true
    tty: true
    ports:
      - "${CRAFT_BEDROCK_PORT:-19132}:19132/udp"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${CRAFT_VERSION:-LATEST}"
      VERSION_FROM_MODRINTH_PROJECTS: "${CRAFT_VERSION_FROM_PLUGINS:-true}"
      MEMORY: "${CRAFT_MEMORY:-2G}"
      SERVER_NAME: "${CRAFT_SERVER_NAME:-Nagel Craftlandia}"
      MOTD: "${CRAFT_MOTD:-Nagel Craftlandia}"
      LEVEL: "${CRAFT_LEVEL_NAME:-CraftlandiaWorld}"
      MODE: "${CRAFT_GAMEMODE:-survival}"
      DIFFICULTY: "${CRAFT_DIFFICULTY:-normal}"
      MAX_PLAYERS: "${CRAFT_MAX_PLAYERS:-20}"
      ONLINE_MODE: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      ENABLE_WHITELIST: "${CRAFT_ENABLE_WHITELIST:-false}"
      ENFORCE_WHITELIST: "${CRAFT_ENFORCE_WHITELIST:-true}"
      WHITELIST: "${CRAFT_WHITELIST:-}"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "${CRAFT_VIEW_DISTANCE:-10}"
      SIMULATION_DISTANCE: "${CRAFT_SIMULATION_DISTANCE:-6}"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${CRAFT_RCON_PASSWORD:-minecraft}"
      MODRINTH_DOWNLOAD_DEPENDENCIES: "required"
      MODRINTH_PROJECTS: |
        luckperms
        essentialsx
        essentialsx-spawn
        griefprevention
        vaultunlocked
        viaversion
        viabackwards
        quickshop-hikari?
      PLUGINS: |
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot
    volumes:
      - ./craftlandia-data:/data
